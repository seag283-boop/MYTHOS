<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | MYTHOS</title>
    <link rel="icon" type="image/svg+xml" href="image/icons/logo.svg">

    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">


</head>

<body>
    <div id="common-header"></div>

    <main class="login-page">
        <section class="login-panel">
            <a href="index.html" class="login-logo">MYTHOS</a>

            <h1>다시 만나 뵙게 되어 반갑습니다.</h1>
            <p class="login-description">
                로그인하고 마음에 드는 작품을 보관하세요.
            </p>

            <form id="login-form">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" placeholder="이메일 주소" autocomplete="email" required>

                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호" autocomplete="current-password"
                    required>

                <button type="submit" class="login-button">
                    로그인
                </button>

                <p id="login-message" role="status"></p>
            </form>

            <p class="signup-link">
                아직 계정이 없으신가요?
                <a href="signup.html">회원가입</a>
            </p>
        </section>
    </main>
    <div id="common-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
